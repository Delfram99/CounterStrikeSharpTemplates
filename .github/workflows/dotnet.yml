name: Publish && Release

on:
  push:
    branches: [ "main" ]
    paths:
      - 'content/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'content/**'
  workflow_dispatch:

jobs:
  version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.create_tag.outputs.new_tag }}
      version_changed: ${{ steps.check_version.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Get latest release tag
        id: get_latest
        uses: actions/github-script@v7.0.1
        with:
          result-encoding: string
          script: |
            let tag_name;
            try {
              const response = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              tag_name = response.data.tag_name;
            } catch (error) {
              if (error.status === 404) {
                console.log("No releases found. Setting default value.");
                tag_name = 'v0.0.0';
              } else {
                throw error;
              }
            }
            return tag_name;

      - name: Bump version and push tag
        id: create_tag
        if: github.event_name == 'push'
        uses: anothrNick/github-tag-action@1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false
          DEFAULT_BUMP: none
          INITIAL_VERSION: 1.0.0
      
      - name: Check if version changed
        id: check_version
        env:
          NEW_TAG: ${{ steps.create_tag.outputs.new_tag }}
          LATEST_TAG: ${{ steps.get_latest.outputs.result }}
        run: |
          new_version="${NEW_TAG#v}"
          latest_version="${LATEST_TAG#v}"
          if [ -n "$new_version" ] && [ "$new_version" != "$latest_version" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  pack:
    if: needs.version.outputs.version_changed == 'true'
    needs: version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack -o nupkgs /p:PackageVersion=${{ needs.version.outputs.new_tag }}

      - name: Push to NuGet
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  release:
    needs: [version, pack]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: actions/github-script@v7.0.1
        env:
          NEW_TAG: ${{ needs.version.outputs.new_tag }}
        with:
          script: |
            const tag = process.env.NEW_TAG;
            const version = tag.replace(/^v/, '');
            const { owner, repo } = context.repo;

            const notes = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: tag
            });

            let body = notes.data.body;

            // generate-notes lists merged pull requests only - fall back to plain commits when there are none
            if (!/^\* /m.test(body)) {
              const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 1 });
              const previousTag = releases.data[0]?.tag_name;

              if (previousTag) {
                const compare = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${previousTag}...${tag}`
                });

                const lines = compare.data.commits.map((c) => {
                  const subject = c.commit.message.split('\n')[0];
                  const author = c.author?.login ?? c.commit.author.name;
                  return `* ${subject} by @${author} ([${c.sha.slice(0, 7)}](${c.html_url}))`;
                });

                if (lines.length > 0) {
                  body = `## What's Changed\n${lines.join('\n')}\n\n${body}`;
                }
              }
            }

            body = body.replace(
              /\*\*Full Changelog\*\*: (\S+\/compare\/(\S+))/,
              '**Full Changelog**: [$2]($1)'
            );

            const releaseResponse = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `v${version}`,
              body: body,
              draft: false,
              prerelease: false
            });
            
            console.log(`Release created: ${releaseResponse.data.html_url}`);